<html lang="ru">
<head>

<title>Опросник близости</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');
  :root{

  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;padding-bottom:90px;}
  .wrap{max-width:720px;margin:0 auto;padding:28px 18px 0;}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:2.1rem;margin:0 0 4px;letter-spacing:.3px;}
  .sub{color:var(--muted);font-size:.9rem;margin:0 0 20px;line-height:1.5;}
  .home-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px;display:flex;align-items:center;gap:14px;cursor:pointer;}
  .home-card .emoji{font-size:1.8rem;}
  .home-card .txt h3{margin:0 0 3px;font-family:'Cormorant Garamond',serif;font-size:1.2rem;}
  .home-card .txt p{margin:0;color:var(--muted);font-size:.8rem;}
  .home-card.results{background:linear-gradient(135deg,var(--surface2),var(--surface));border-color:var(--a);}
  .status-pill{font-family:'IBM Plex Mono',monospace;font-size:.66rem;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);margin-left:auto;flex-shrink:0;}

  .server-note{font-size:.76rem;color:var(--muted);text-align:center;margin:18px 0 6px;line-height:1.5;}
  .progress-bar{height:6px;background:var(--surface);border-radius:99px;overflow:hidden;margin-bottom:20px;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--b),var(--a));width:0%;transition:width .3s;}
  .progress-label{font-size:.76rem;color:var(--muted);margin-top:6px;}
  details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  summary{padding:14px 16px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.1rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;}
  summary::-webkit-details-marker{display:none;}
  summary .arrow{color:var(--muted);font-size:.8rem;transition:transform .2s;}
  details[open] summary .arrow{transform:rotate(90deg);}
  .item{padding:13px 16px;border-top:1px solid var(--line);}
  .item-text{font-size:.93rem;margin-bottom:9px;line-height:1.4;}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
  .row input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:99px;background:var(--line);outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--a);box-shadow:0 0 0 3px var(--bg);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;border:none;background:var(--a);box-shadow:0 0 0 3px var(--bg);cursor:pointer;}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:600;width:30px;text-align:center;flex-shrink:0;padding:3px 0;border-radius:6px;background:var(--surface2);}
  .subrow{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .caption{font-size:.68rem;color:var(--muted);}
  .wish-check{display:flex;align-items:center;gap:6px;flex-shrink:0;cursor:pointer;padding:4px 10px 4px 6px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);}
  .wish-check input{width:15px;height:15px;accent-color:var(--a);cursor:pointer;flex-shrink:0;}
  .wish-check span{font-size:.68rem;color:var(--muted);white-space:nowrap;}
  .wish-check.checked{background:rgba(209,163,92,.18);border-color:var(--a);}
  .wish-check.checked span{color:var(--a);}
  .open-item{padding:13px 16px;border-top:1px solid var(--line);}
  .open-q{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.02rem;margin-bottom:8px;}
  textarea{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 11px;font-family:'Inter';font-size:.87rem;resize:vertical;min-height:44px;}
  .cta-bar{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(0deg,var(--bg) 60%,transparent);padding:22px 18px 18px;display:flex;justify-content:center;gap:10px;}
  .cta{background:var(--a);color:#241726;border:none;font-family:'Inter';font-weight:600;font-size:.94rem;padding:14px 26px;border-radius:99px;cursor:pointer;box-shadow:0 6px 20px rgba(209,163,92,.35);max-width:420px;width:100%;}
  .cta.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);box-shadow:none;max-width:140px;}
  .cta:active{transform:scale(.98);}
  .res-header{text-align:center;margin-bottom:22px;padding-top:6px;}
  .res-section{margin-bottom:24px;}
  .res-section h2{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:600;margin:0 0 4px;}
  .res-section .desc{color:var(--muted);font-size:.8rem;margin-bottom:12px;}
  .res-list{list-style:none;padding:0;margin:0;}
  .res-list li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:.89rem;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .res-list li .cat{color:var(--muted);font-size:.66rem;display:block;margin-top:2px;}
  .res-list li .score{font-family:'IBM Plex Mono',monospace;font-size:.7rem;color:var(--muted);flex-shrink:0;white-space:nowrap;}
  .mutual h2{color:var(--good);} .gentle h2{color:var(--a);} .discuss h2{color:#e0b878;} .boundary h2{color:var(--b);}
  .joint h2{color:#e0a8c8;} .personal-w h2{color:var(--a);} .personal-h h2{color:var(--b);}
  .empty-note{color:var(--muted);font-size:.84rem;font-style:italic;}
  .open-answers{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;}
  .open-answers .q{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1rem;margin-bottom:8px;}
  .open-answers .ans{font-size:.87rem;margin-bottom:4px;}
  .open-answers .ans .tag{font-family:'IBM Plex Mono',monospace;font-size:.66rem;margin-right:6px;}
  .open-answers .ans.a .tag{color:var(--a);} .open-answers .ans.b .tag{color:var(--b);}
  .open-answers .ans.empty{color:var(--muted);font-style:italic;}
  .action-row{display:flex;gap:10px;margin:18px 0;}
  .action-row button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-family:'Inter';font-size:.85rem;cursor:pointer;}
  .action-row button.primary{background:var(--a);color:#241726;border:none;font-weight:600;}
  .waiting-box{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:30px 20px;margin-top:20px;}
  .waiting-box .big{font-size:2rem;margin-bottom:10px;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:360px;width:100%;}
  .modal h3{margin:0 0 8px;font-family:'Cormorant Garamond',serif;font-size:1.2rem;}
  .modal p{color:var(--muted);font-size:.85rem;margin:0 0 16px;}
  .modal button{display:block;width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);margin-bottom:8px;cursor:pointer;font-family:'Inter';font-size:.87rem;}
  .modal button.danger{background:var(--b);border:none;color:#fff;}
  .modal button.cancel{background:transparent;}

  .compare-cat{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;}
  .compare-cat summary{padding:13px 16px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.05rem;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;}
  .compare-cat summary::-webkit-details-marker{display:none;}
  .compare-cat summary .arrow{color:var(--muted);font-size:.8rem;transition:transform .2s;}
  .compare-cat[open] summary .arrow{transform:rotate(90deg);}
  .compare-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);}
  .compare-row.match-exact{background:rgba(209,163,92,.16);border-left:3px solid var(--a);}
  .compare-row.match-close{background:rgba(209,163,92,.06);}
  .compare-row .ctext{flex:1;font-size:.87rem;line-height:1.35;}
  .compare-row .cscores{display:flex;gap:6px;flex-shrink:0;}
  .compare-row .cbadge{font-family:'IBM Plex Mono',monospace;font-size:.72rem;font-weight:600;width:34px;text-align:center;padding:3px 0;border-radius:6px;}
  .compare-row .cbadge.w{background:rgba(209,163,92,.2);}
  .compare-row .cbadge.h{background:rgba(193,73,95,.2);}
  .compare-legend{display:flex;gap:14px;font-size:.72rem;color:var(--muted);margin-bottom:10px;flex-wrap:wrap;}
  .compare-legend .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle;}

</head>

function withTimeout(promise, ms){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('Сервер не отвечает (тайм-аут ' + ms/1000 + 'с)')), ms))
  ]);
}

let connectionWarning = false;

async function saveAnswers(role, payload){
  if(FIREBASE_READY){
    try{ await withTimeout(db.collection(COLLECTION).doc(role).set(payload), 8000); connectionWarning=false; return true; }
    catch(e){ console.error(e); connectionWarning=true; return false; }
  } else { memoryStore['answers:'+role] = JSON.stringify(payload); return true; }
}
async function loadAnswers(role){
  if(FIREBASE_READY){
    try{ const snap = await withTimeout(db.collection(COLLECTION).doc(role).get(), 8000); connectionWarning=false; return snap.exists ? snap.data() : null; }
    catch(e){ console.error(e); connectionWarning=true; return null; }
  } else { const v = memoryStore['answers:'+role]; return v ? JSON.parse(v) : null; }
}
async function deleteAnswers(role){
  if(FIREBASE_READY){ try{ await withTimeout(db.collection(COLLECTION).doc(role).delete(), 8000); connectionWarning=false; }catch(e){ console.error(e); connectionWarning=true; } }
  else { delete memoryStore['answers:'+role]; }
}

function fmt(v){ v=parseInt(v); return (v>0?'+':'')+v; }
function badgeColor(v){ v=parseInt(v); if(v<=-2)return"#c1495f"; if(v===-1)return"#8a6a78"; if(v===0)return"#ab8fa0"; if(v===1)return"#c9b27a"; return"#d1a35c"; }

function updateScore(role,id,val){

function classify(w,h){
  const mutual=[],gentleW=[],gentleH=[],discuss=[],boundary=[];
  ITEMS.forEach(it=>{
    const a = w.scores[it.id] !== undefined ? parseInt(w.scores[it.id]) : 0;
    const b = h.scores[it.id] !== undefined ? parseInt(h.scores[it.id]) : 0;
    if(a<=-2 || b<=-2){ boundary.push({...it,a,b}); return; }
    if(a>=2 && b>=2){ mutual.push({...it,a,b}); return; }
    if(a>=2 && b>=-1 && b<=1){ gentleW.push({...it,a,b}); return; }
    if(b>=2 && a>=-1 && a<=1){ gentleH.push({...it,a,b}); return; }
    if((a>=2 && b===-1)||(b>=2 && a===-1)){ discuss.push({...it,a,b}); return; }
  });
  mutual.sort((x,y)=>(y.a+y.b)-(x.a+x.b));
  gentleW.sort((x,y)=>y.a-x.a); gentleH.sort((x,y)=>y.b-x.b);
  return {mutual,gentleW,gentleH,discuss,boundary};
}

function wishlists(w,h){
  const wWish = w.wishlist||{}, hWish = h.wishlist||{};
  const personalW=[], personalH=[], joint=[];
  ITEMS.forEach(it=>{
    const inW = !!wWish[it.id], inH = !!hWish[it.id];
    if(inW && inH) joint.push(it);
    else if(inW) personalW.push(it);
    else if(inH) personalH.push(it);
  });
  return {personalW, personalH, joint};
}

function scoreStr(a,b){ return `${a>0?'+':''}${a} / ${b>0?'+':''}${b}`; }
function section(cls,title,desc,arr,mode){
  let inner = arr.length===0 ? `<p class="empty-note">Пока пусто</p>` :
    `<ul class="res-list">`+arr.map(it=>{
      let right = '';
      if(mode==='score') right = `<span class="score">${scoreStr(it.a,it.b)}</span>`;
      return `<li><div>${it.text}<span class="cat">${it.cat}</span></div>${right}</li>`;
    }).join('')+`</ul>`;
  return `<div class="res-section ${cls}"><h2>${title}</h2><p class="desc">${desc}</p>${inner}</div>`;
}

function renderFullComparison(w,h){
  let html = `<div class="res-section">
    <h2 style="color:var(--ink)">🔍 Все ответы рядом</h2>
    <p class="desc">Оценки обоих по каждому пункту — совпадения подсвечены</p>
    <div class="compare-legend">
      <span><span class="dot" style="background:rgba(209,163,92,.6)"></span>Полное совпадение</span>
      <span><span class="dot" style="background:rgba(209,163,92,.25)"></span>Близко (разница в 1)</span>
      <span><span class="dot" style="background:rgba(209,163,92,.5)"></span>🌸 Жена</span>
      <span><span class="dot" style="background:rgba(193,73,95,.5)"></span>🌊 Муж</span>
    </div>`;
  DATA.forEach(([cat, texts], catIdx) => {
    const startId = ITEMS.findIndex(it => it.cat === cat) + 1;
    html += `<details class="compare-cat"><summary>${cat}<span class="arrow">▸</span></summary>`;
    if(cat === "Внешность и тело"){
      html += `<div style="padding:10px 16px 0;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1rem;color:var(--muted);">Меня заводит:</div>`;
    }
    texts.forEach((text, i) => {
      const id = startId + i;
      const a = w.scores[id] !== undefined ? parseInt(w.scores[id]) : 0;
      const b = h.scores[id] !== undefined ? parseInt(h.scores[id]) : 0;
      const diff = Math.abs(a-b);
      const cls = diff===0 ? 'match-exact' : (diff===1 ? 'match-close' : '');
      html += `<div class="compare-row ${cls}">
        <div class="ctext">${text}</div>
        <div class="cscores">
          <span class="cbadge w">${fmt(a)}</span>
          <span class="cbadge h">${fmt(b)}</span>
        </div>
      </div>`;
    });
    html += `</details>`;
  });
  html += `</div>`;
  return html;
}

  const dumpScore=(title,arr)=>{
    txt+=`${title}\n`;
    if(arr.length===0) txt+=`  (пусто)\n`;
    arr.forEach(it=>txt+=`  - ${it.text} (${scoreStr(it.a,it.b)})\n`);
    txt+=`\n`;
  };
  dumpPlain('СОВМЕСТНЫЙ ВИШЛИСТ', joint);
  dumpPlain('ЛИЧНЫЙ ВИШЛИСТ ЖЕНЫ', personalW);
  dumpPlain('ЛИЧНЫЙ ВИШЛИСТ МУЖА', personalH);
  dumpScore('ВЗАИМНОЕ ЖЕЛАНИЕ (ПО ШКАЛЕ)', mutual);
  dumpScore('ЖЕНА ХОЧЕТ, МУЖ НЕЙТРАЛЕН', gentleW);
  dumpScore('МУЖ ХОЧЕТ, ЖЕНА НЕЙТРАЛЬНА', gentleH);
  dumpScore('ТРЕБУЕТ РАЗГОВОРА', discuss);
  dumpPlain('ЖЁСТКИЕ ГРАНИЦЫ (не трогаем)', boundary);
  txt+=`СВОИМИ СЛОВАМИ\n`;
  OPEN_QUESTIONS.forEach((oq,idx)=>{
    const a=(w.open&&w.open[idx]||'').trim()||'—';
    const b=(h.open&&h.open[idx]||'').trim()||'—';
    txt+=`  ${oq[1]}\n    Жена: ${a}\n    Муж: ${b}\n`;
  });
  navigator.clipboard.writeText(txt).then(()=>alert('Скопировано в буфер обмена')).catch(()=>alert('Не удалось скопировать — выделите текст вручную.'));
}

function openResetModal(){
  document.getElementById('modalBody').innerHTML = `
    <h3>Сбросить данные</h3>
    <p>Выберите чьи ответы удалить. Действие необратимо.</p>
    <button onclick="doReset('wife')">🌸 Ответы жены</button>
    <button onclick="doReset('husband')">🌊 Ответы мужа</button>
    <button class="danger" onclick="doReset('all')">⚠️ Всё полностью</button>
    <button class="cancel" onclick="closeModal()">Отмена</button>`;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }
async function doReset(who){
  if(who==='all'){ await deleteAnswers('wife'); await deleteAnswers('husband'); }
  else{ await deleteAnswers(who); }
  closeModal(); renderHome();
}

renderHome();
</script>
