<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  // ✏️ ВСТАВЬ СЮДА СВОИ ДАННЫЕ ИЗ FIREBASE:
  const firebaseConfig = {
    apiKey: "AIzaSyAZkYv8PlDkyS4gZS-n4YqQHTVeBFfLesc",
    authDomain: "quiz-aa226.firebaseapp.com",
    databaseURL: "https://quiz-aa226-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "quiz-aa226",
    storageBucket: "quiz-aa226.firebasestorage.app",
    messagingSenderId: "701562282124",
    appId: "1:701562282124:web:dcf0a29182864fc7705ba9"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Глобальные функции для работы с Firebase
  window.fbSave = async (who, data) => {
    try {
      await set(ref(db, 'quiz/' + who), data);
      return true;
    } catch(e) {
      console.error('Firebase save error:', e);
      return false;
    }
  };

  window.fbLoad = async () => {
    try {
      const snap = await get(ref(db, 'quiz'));
      return snap.exists() ? snap.val() : {};
    } catch(e) {
      console.error('Firebase load error:', e);
      return {};
    }
  };

  window.fbDelete = async (who) => {
    try {
      await set(ref(db, 'quiz/' + who), null);
      return true;
    } catch(e) { return false; }
  };

  // Инициализация после загрузки
  window.addEventListener('load', async () => {
    document.getElementById('loading').style.display='flex';
    window._state = await window.fbLoad();
    document.getElementById('loading').style.display='none';
    window.upSplash();
  });
</script>

  const s=getState();
  who=w;ans=s[w]?.answers?{...s[w].answers}:{};nts=s[w]?.notes?{...s[w].notes}:{};
  const b=document.getElementById('qbadge');b.textContent=w==='wife'?'🌸 Жена':'🌊 Муж';b.className='qbadge '+w[0];
  document.getElementById('sbtn').className='sbtn '+w[0];
  document.getElementById('pb').className='pb '+w[0];
  renQ();show('quiz');upP();
}

async function qBack(){
  const s=getState();
  s[who]=s[who]||{};s[who].answers={...ans};s[who].notes={...nts};
  showFbStatus('Сохраняем...','saving');
  await window.fbSave(who,s[who]);
  setState(s);
  showFbStatus('Сохранено ✓','saved');
  upSplash();show('splash');
}

function renQ(){
  const body=document.getElementById('qbody');body.innerHTML='';
  const lg=document.createElement('div');lg.className='leg';
  lg.innerHTML='<div class="legt">Шкала оценок</div><div class="legr">'+SC.map(s=>`<div class="legrow"><div class="legd" style="background:${s.d}"></div><span style="font-size:10px;color:var(--mut)">${s.v>0?'+'+s.v:s.v} — ${s.l}</span></div>`).join('')+'</div>';
  body.appendChild(lg);
  SECTIONS.forEach((sec,si)=>{
    const sh=document.createElement('div');sh.className='shdr';
    sh.innerHTML=`<div class="smeta"><span class="snum">${si+1}/${SECTIONS.length}</span><span class="ibadge i${sec.i}">${IL[sec.i]}</span></div><div class="sname">${sec.t}</div>${sec.n?`<div class="snote">${sec.n}</div>`:''}`;
    body.appendChild(sh);
    sec.q.forEach((q,qi)=>{
      const k=`${si}_${qi}`;
      if(q==='__freetext__'){
        const c=document.createElement('div');c.className='ftcard';
        const ta=document.createElement('textarea');ta.className='ftarea';
        ta.placeholder='Напиши здесь — партнёр увидит это в результатах...';
        ta.value=nts[`ft_${si}`]||'';
        ta.addEventListener('input',()=>{nts[`ft_${si}`]=ta.value;});
        c.appendChild(ta);body.appendChild(c);return;
      }
      const c=document.createElement('div');c.className='card'+(ans[k]!==undefined?' ans':'');c.id='c_'+k;
      const rh=SC.map(s=>`<button class="rbtn${ans[k]===s.v?' on':''}" data-v="${s.v}" onclick="rate('${k}',${s.v},this)"><span class="rv">${s.v>0?'+'+s.v:s.v}</span><span class="rl">${s.l}</span></button>`).join('');
      c.innerHTML=`<div class="qt">${q}</div><div class="rrow">${rh}</div><button class="ntog" onclick="togN('${k}')">+ заметка</button><textarea class="nin" id="n_${k}" rows="2" placeholder="Условие..." oninput="svN('${k}',this.value)">${nts[k]||''}</textarea>`;
      if(nts[k])setTimeout(()=>{const t=document.getElementById('n_'+k);if(t)t.style.display='block';},0);
      body.appendChild(c);
    });
  });
}

function rate(k,v,btn){
  if(ans[k]===v){delete ans[k];document.getElementById('c_'+k).querySelectorAll('.rbtn').forEach(b=>b.classList.remove('on'));document.getElementById('c_'+k).classList.remove('ans');}
  else{ans[k]=v;document.getElementById('c_'+k).querySelectorAll('.rbtn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');document.getElementById('c_'+k).classList.add('ans');}
  upP();
}
function togN(k){const t=document.getElementById('n_'+k);t.style.display=t.style.display==='block'?'none':'block';if(t.style.display==='block')t.focus();}
function svN(k,v){nts[k]=v;}
const totQ=()=>SECTIONS.reduce((a,s)=>a+s.q.filter(q=>q!=='__freetext__').length,0);
function upP(){
  const tot=totQ(),a=Object.keys(ans).length;
  document.getElementById('pb').style.width=Math.round(a/tot*100)+'%';
  document.getElementById('qcnt').textContent=`${a} из ${tot}`;
  const btn=document.getElementById('sbtn');
  if(a>=Math.floor(tot*.4)){btn.classList.add('on');btn.textContent=a===tot?'Готово! Сохранить':`Сохранить (${a}/${tot})`;}
  else{btn.classList.remove('on');btn.textContent=`Ответьте хотя бы на 40% (${a}/${tot})`;}
  const mid=window.innerHeight/2;let cur='';
  document.querySelectorAll('.shdr').forEach(h=>{if(h.getBoundingClientRect().top<mid)cur=h.querySelector('.sname').textContent;});
  document.getElementById('qsl').textContent=cur;
}
document.addEventListener('scroll',upP,{passive:true});

async function submitQ(){
  if(Object.keys(ans).length<Math.floor(totQ()*.4))return;
  const s=getState();
  s[who]={answers:{...ans},notes:{...nts},done:true};
  showFbStatus('Сохраняем...','saving');
  const ok=await window.fbSave(who,s[who]);
  if(ok){
    setState(s);
    showFbStatus('Сохранено ✓','saved');
    const other=who==='wife'?'husband':'wife';
    if(s[other]?.done)goRes();
    else{alert('Ответы сохранены! Когда партнёр заполнит анкету — нажмите «Посмотреть результаты».');show('splash');}
  } else {
    showFbStatus('Ошибка сохранения','error');
    alert('Ошибка соединения. Проверьте интернет.');
  }
}

function renRes(){
  const s=getState();const wA=s.wife?.answers||{},hA=s.husband?.answers||{},wD=!!s.wife?.done,hD=!!s.husband?.done;
  document.getElementById('ws').innerHTML=`<div class="wc f ${wD?'done':'pend'}"><div class="wcn">🌸 Жена</div><div class="wcs">${wD?'Ответила ✓':'Не заполнила'}</div></div><div class="wc m ${hD?'done':'pend'}"><div class="wcn">🌊 Муж</div><div class="wcs">${hD?'Ответил ✓':'Не заполнил'}</div></div>`;
  document.getElementById('ew').style.display=wD?'flex':'none';
  document.getElementById('eh').style.display=hD?'flex':'none';
  const allK=new Set([...Object.keys(wA),...Object.keys(hA)]);
  const hot=[],exp=[],conf=[];
  allK.forEach(k=>{
    const w=wA[k]??null,h=hA[k]??null;if(w===null||h===null)return;
    const [si,qi]=k.split('_').map(Number);if(!SECTIONS[si])return;
    const o={k,t:SECTIONS[si].q[qi],s:SECTIONS[si].t,i:SECTIONS[si].i,w,h};
    if(w>=1&&h>=1)hot.push(o);
    else if((w>=1&&h===0)||(h>=1&&w===0))exp.push(o);
    else if((w>=1&&h<0)||(h>=1&&w<0))conf.push(o);
  });
  hot.sort((a,b)=>(b.w+b.h)-(a.w+a.h));
  renHot(hot);renExp(exp);renConf(conf);renStat(wA,hA);renFreeText(s);
  document.getElementById('rsub').textContent=`${hot.length} совпадений · ${exp.length} для разговора · ${conf.length} конфликтов`;
}
function renFreeText(state){
  const el=document.getElementById('tFreeText');if(!el)return;
  const wN=state.wife?.notes||{},hN=state.husband?.notes||{};
  let h='';
  SECTIONS.forEach((sec,si)=>{
    if(!sec.q.includes('__freetext__'))return;
    const wT=(wN[`ft_${si}`]||'').trim(),hT=(hN[`ft_${si}`]||'').trim();
    if(!wT&&!hT)return;
    h+=`<div class="ms"><div class="mst">📝 ${sec.t}</div>`;
    if(wT)h+=`<div class="mi"><div class="mit"><span style="color:var(--af);font-size:10px">🌸 Жена:</span><br>${wT}</div></div>`;
    if(hT)h+=`<div class="mi"><div class="mit"><span style="color:var(--am);font-size:10px">🌊 Муж:</span><br>${hT}</div></div>`;
    h+='</div>';
  });
  el.innerHTML=h||'<div class="es">Никто не оставил текст</div>';
}
const iH=o=>`<div class="mi"><div class="mit">${o.t}<br><small style="color:var(--mut);font-size:9px">${o.s}</small></div><div class="msc"><span class="sc f">${o.w>0?'+'+o.w:o.w}</span><span class="sc m">${o.h>0?'+'+o.h:o.h}</span></div></div>`;
function renHot(hot){
  const el=document.getElementById('tHot');if(!hot.length){el.innerHTML='<div class="es">Нет совпадений — ответьте на больше вопросов 🙂</div>';return;}
  const dr=hot.filter(x=>x.w===3&&x.h===3),wt=hot.filter(x=>(x.w>=2||x.h>=2)&&!(x.w===3&&x.h===3)),cu=hot.filter(x=>x.w===1&&x.h===1);
  let h='';
  if(dr.length)h+=`<div class="ms"><div class="mst">🔥 Оба мечтают <span class="mb hot">${dr.length}</span></div>${dr.map(iH).join('')}</div>`;
  if(wt.length)h+=`<div class="ms"><div class="mst">✨ Оба хотят <span class="mb hot">${wt.length}</span></div>${wt.map(iH).join('')}</div>`;
  if(cu.length)h+=`<div class="ms"><div class="mst">💫 Оба любопытны <span class="mb hot">${cu.length}</span></div>${cu.map(iH).join('')}</div>`;
  el.innerHTML=h;
}
function renExp(exp){
  const el=document.getElementById('tExplore');if(!exp.length){el.innerHTML='<div class="es">Нет таких пунктов</div>';return;}
  const wW=exp.filter(x=>x.w>=1&&x.h===0),hW=exp.filter(x=>x.h>=1&&x.w===0);
  let h=`<div style="background:rgba(126,184,212,.07);border:1px solid rgba(126,184,212,.15);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:11px;color:rgba(200,220,240,.8);line-height:1.6">Один открыт, другой нейтрален (0). Повод поговорить — без давления.</div>`;
  if(wW.length)h+=`<div class="ms"><div class="mst">🌸 Жена хочет, муж нейтрален <span class="mb exp">${wW.length}</span></div>${wW.map(iH).join('')}</div>`;
  if(hW.length)h+=`<div class="ms"><div class="mst">🌊 Муж хочет, жена нейтральна <span class="mb exp">${hW.length}</span></div>${hW.map(iH).join('')}</div>`;
  el.innerHTML=h;
}
function renConf(conf){
  const el=document.getElementById('tConflict');
  if(!conf.length){el.innerHTML='<div class="es">🎉 Конфликтов нет!</div>';return;}
  el.innerHTML=`<div style="background:rgba(224,112,112,.08);border:1px solid rgba(224,112,112,.2);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:11px;color:rgba(240,200,200,.8);line-height:1.6">Один хочет, другой против. <strong>Не давите.</strong> Просто знайте о разнице.</div>`+conf.map(iH).join('');
}
function renStat(wA,hA){
  const el=document.getElementById('tStats');
  const wP=Object.values(wA).filter(v=>v>0).length,hP=Object.values(hA).filter(v=>v>0).length;
  const wN=Object.keys(wA).length,hN=Object.keys(hA).length;
  let rows='';
  [1,2,3,4,5].forEach(lv=>{
    const ss=SECTIONS.filter(s=>s.i===lv);if(!ss.length)return;
    const tot=ss.reduce((a,s)=>a+s.q.length,0);
    const wV=[],hV=[];
    ss.forEach(sec=>{const si=SECTIONS.indexOf(sec);sec.q.forEach((_,qi)=>{const k=`${si}_${qi}`;if(wA[k]!==undefined)wV.push(wA[k]);if(hA[k]!==undefined)hV.push(hA[k]);});});
    const wp=wV.length?Math.round(wV.filter(v=>v>0).length/tot*100):0;
    const hp=hV.length?Math.round(hV.filter(v=>v>0).length/tot*100):0;
    rows+=`<div style="padding:8px 0;border-bottom:1px solid var(--bdr)"><div style="display:flex;align-items:center;gap:7px;margin-bottom:5px"><span class="ibadge i${lv}">${IL[lv]}</span><span style="font-size:9px;color:var(--mut)">${tot} вопросов</span></div><div style="display:flex;gap:5px;align-items:center"><span style="font-size:9px;color:var(--af);width:13px">🌸</span><div style="flex:1;height:4px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden"><div style="height:100%;width:${wp}%;background:var(--af);border-radius:2px"></div></div><span style="font-size:9px;color:var(--af);min-width:24px">${wp}%</span><span style="font-size:9px;color:var(--am);width:13px">🌊</span><div style="flex:1;height:4px;background:rgba(255,255,255,.05);border-radius:2px;overflow:hidden"><div style="height:100%;width:${hp}%;background:var(--am);border-radius:2px"></div></div><span style="font-size:9px;color:var(--am);min-width:24px">${hp}%</span></div></div>`;
  });
  el.innerHTML=`<div style="display:flex;gap:10px;margin-bottom:16px"><div style="flex:1;text-align:center;padding:13px;background:rgba(232,160,192,.08);border:1px solid rgba(232,160,192,.2);border-radius:10px"><div style="font-size:9px;color:var(--mut);margin-bottom:5px">🌸 Жена открыта к</div><div style="font-size:26px;font-weight:700;color:var(--af)">${wP}</div><div style="font-size:9px;color:var(--mut)">из ${wN}</div></div><div style="flex:1;text-align:center;padding:13px;background:rgba(126,184,212,.08);border:1px solid rgba(126,184,212,.2);border-radius:10px"><div style="font-size:9px;color:var(--mut);margin-bottom:5px">🌊 Муж открыт к</div><div style="font-size:26px;font-weight:700;color:var(--am)">${hP}</div><div style="font-size:9px;color:var(--mut)">из ${hN}</div></div></div><div style="font-family:'Cormorant Garamond',serif;font-size:16px;margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--bdr)">По уровням</div>${rows}`;
}
function swTab(t){
  const ts=['hot','explore','conflict','stats','freeText'];
  document.querySelectorAll('.tbtn').forEach((b,i)=>b.classList.toggle('on',ts[i]===t));
  ts.forEach(x=>{const e=document.getElementById('t'+x[0].toUpperCase()+x.slice(1));if(e)e.classList.toggle('on',x===t);});
}

</script>
</body>
</html>
